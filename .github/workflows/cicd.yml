name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  train-eval-test:
    name: Retrain Evaluate and Test Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain Model (Dataset + Feedback DB)
        run: |
          python ml/train.py

      - name: Evaluate Model Performance Gate
        run: |
          python ml/evaluate.py

      - name: Run Unit and API Tests
        run: |
          python -m pytest -v

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-model-artifact
          path: models/sentiment_model.pkl

  docker-build-test:
    name: Build and Test Docker Image
    needs: train-eval-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Model Artifact
        uses: actions/download-artifact@v4
        with:
          name: sentiment-model-artifact
          path: models/

      - name: Build Docker Image
        run: |
          docker build -t yt-sentiment-api:latest .

      - name: Run Container and Verify Endpoint
        run: |
          docker run -d -p 8000:8000 --name api-container yt-sentiment-api:latest
          
          # Wait up to 30 seconds for the service to start
          timeout 30s bash -c 'until curl -s -f http://localhost:8000/health; do sleep 2; done' || {
            echo "Health check failed. Container logs:"
            docker logs api-container
            docker stop api-container
            exit 1
          }
          
          echo "Health check passed successfully."
          docker stop api-container