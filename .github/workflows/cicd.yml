name: Active Learning & CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger button from GitHub Actions UI
  schedule:
    - cron: '0 0 * * 0' # Weekly automatic retraining trigger (Sunday Midnight)

jobs:
  train-eval-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain Model (CSV Base Data + Feedback DB)
        run: |
          python ml/train.py

      - name: Evaluate Model Performance Gate
        run: |
          python ml/evaluate.py

      - name: Run API Unit Tests
        run: |
          pytest tests/test_api.py -v

  build-and-push-docker:
    needs: train-eval-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/yt-sentiment-app:latest